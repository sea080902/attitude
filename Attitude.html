<style>
:root {
  --brown-dark: #5c3d2e;
  --brown-mid: #7d5a4f;
  --brown-light: #a67c6d;
  --ivory: #fdf6ec;
  --ivory-dark: #f0e6d3;
  --ivory-deeper: #e8d8c4;
  --cream: #fffaf3;
  --green: #6b8f6e;
  --green-light: #8aac8d;
  --green-pale: #deeede;
  --border: #d9c8b8;
  --text: #3d2b1f;
  --text-light: #8a6a5a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Gowun Dodum', sans-serif;
  background: var(--ivory);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── SPLASH ── */
#splash {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--ivory-dark);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px;
  animation: splashFadeOut 0.6s ease 2.4s forwards;
}
@keyframes splashFadeOut {
  to { opacity: 0; pointer-events: none; }
}
#splash svg { animation: bunnyBounce 0.8s ease-in-out infinite alternate; }
@keyframes bunnyBounce {
  from { transform: translateY(0); }
  to   { transform: translateY(-10px); }
}
.splash-title {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 2.2rem; font-weight: 800;
  color: var(--brown-dark);
  animation: fadeUp 0.7s ease 0.3s both;
}
.splash-sub {
  font-size: 0.75rem; color: var(--brown-light);
  letter-spacing: 0.15em; text-transform: uppercase;
  animation: fadeUp 0.7s ease 0.5s both;
}
.splash-dots {
  display: flex; gap: 8px;
  animation: fadeUp 0.7s ease 0.8s both;
}
.splash-dots span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--brown-light);
  animation: dotPulse 0.6s ease-in-out infinite alternate;
}
.splash-dots span:nth-child(2) { animation-delay: 0.2s; }
.splash-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotPulse { to { opacity: 0.2; transform: scale(0.8); } }
@keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

/* ── TOAST ── */
#toast-container {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
  z-index: 9999; display: flex; flex-direction: column; gap: 8px; align-items: center;
  pointer-events: none;
}
.toast {
  background: var(--brown-dark);
  color: #fff; font-size: 0.85rem;
  padding: 10px 20px; border-radius: 999px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.18);
  animation: toastIn 0.35s cubic-bezier(.34,1.56,.64,1) both;
  white-space: nowrap;
}
.toast.success { background: var(--green); }
.toast.error   { background: #b94040; }
.toast.out     { animation: toastOut 0.3s ease forwards; }
@keyframes toastIn  { from { opacity:0; transform:translateY(16px) scale(0.9); } to { opacity:1; transform:translateY(0) scale(1); } }
@keyframes toastOut { to   { opacity:0; transform:translateY(10px) scale(0.95); } }

/* ── HEADER ── */
header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(253,246,236,0.92); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px 0;
}
.header-top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.logo {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 1.5rem; font-weight: 800;
  color: var(--brown-dark);
}
.date-badge {
  background: var(--ivory-dark);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 0.75rem;
  color: var(--text-light);
  display: flex; align-items: center; gap: 5px;
}
.date-badge .material-symbols-outlined { font-size: 15px; }

/* ── NAV TABS ── */
nav { display: flex; gap: 4px; }
.nav-btn {
  flex: 1; padding: 10px 6px 12px;
  border: none; background: none; cursor: pointer;
  font-family: 'Gowun Dodum', sans-serif;
  font-size: 0.88rem; color: var(--text-light);
  position: relative; transition: color 0.2s;
}
.nav-btn::after {
  content: ''; position: absolute; bottom: 0; left: 10%; right: 10%; height: 3px;
  background: var(--brown-dark); border-radius: 2px 2px 0 0;
  transform: scaleX(0); transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
}
.nav-btn.active { color: var(--brown-dark); font-weight: 700; }
.nav-btn.active::after { transform: scaleX(1); }

/* ── MAIN ── */
main { max-width: 480px; margin: 0 auto; padding: 20px 16px 100px; }

/* ── TAB VIEWS ── */
.tab-view { display: none; }
.tab-view.active {
  display: block;
  animation: tabSlideIn 0.35s ease both;
}
@keyframes tabSlideIn {
  from { opacity:0; transform:translateY(14px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ── CARD ── */
.card {
  background: var(--cream);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 22px;
  margin-bottom: 16px;
  box-shadow: 0 2px 12px rgba(92,61,46,0.06);
  animation: cardPop 0.4s cubic-bezier(.34,1.4,.64,1) both;
}
@keyframes cardPop { from { opacity:0; transform:scale(0.97) translateY(10px); } to { opacity:1; transform:scale(1) translateY(0); } }
.card-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 1rem; font-weight: 700;
  color: var(--brown-dark); margin-bottom: 18px;
}
.card-title .material-symbols-outlined { color: var(--brown-mid); font-size: 20px; }

/* ── FORM ELEMENTS ── */
label.field-label {
  display: block; font-size: 0.68rem;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--text-light); margin-bottom: 5px; margin-left: 2px;
}
select, input, textarea {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  background: var(--ivory);
  color: var(--text);
  font-family: 'Gowun Dodum', sans-serif;
  font-size: 0.9rem;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  -webkit-appearance: none;
}
select:focus, input:focus, textarea:focus {
  border-color: var(--brown-mid);
  box-shadow: 0 0 0 3px rgba(125,90,79,0.12);
}
textarea { resize: none; height: 90px; }
.field-row { margin-bottom: 12px; }
.field-half { display: flex; gap: 10px; }
.field-half > div { flex: 1; }

/* ── BUTTONS ── */
.btn {
  display: block; width: 100%;
  padding: 13px; border-radius: 14px;
  border: none; cursor: pointer;
  font-family: 'Gowun Dodum', sans-serif;
  font-size: 0.95rem; font-weight: 700;
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--brown-dark); color: #fff;
  box-shadow: 0 3px 14px rgba(92,61,46,0.25);
}
.btn-primary:hover { background: var(--brown-mid); }
.btn-secondary {
  background: var(--ivory-dark); color: var(--brown-dark);
  border: 1.5px solid var(--border);
}
.btn-green {
  background: var(--green); color: #fff;
  box-shadow: 0 3px 14px rgba(107,143,110,0.25);
}
.btn-green:hover { background: var(--green-light); }
.btn-danger { background: #fceaea; color: #b94040; border: 1.5px solid #f0c8c8; }
.btn-sm {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 14px; border-radius: 999px;
  font-size: 0.75rem; font-weight: 700;
  border: none; cursor: pointer; font-family: 'Gowun Dodum', sans-serif;
  transition: transform 0.15s;
}
.btn-sm:active { transform: scale(0.95); }
.btn-sm-primary { background: var(--brown-dark); color: #fff; }
.btn-sm-green   { background: var(--green); color: #fff; }

/* ── CATEGORY LIST ── */
.cat-item {
  background: var(--ivory-dark); border: 1px solid var(--border);
  border-radius: 14px; padding: 12px 14px; margin-bottom: 8px;
}
.cat-item-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.cat-name { font-size: 0.88rem; font-weight: 700; color: var(--brown-dark); }
.btn-del-cat {
  background: none; border: none; cursor: pointer;
  font-size: 0.7rem; color: #c07070; font-family: 'Gowun Dodum', sans-serif;
  padding: 2px 8px;
}
.book-chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--cream); border: 1px solid var(--border);
  border-radius: 999px; padding: 3px 10px;
  font-size: 0.78rem; color: var(--text-light); margin: 3px;
}
.book-chip button {
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center; padding: 0;
  color: #c07070;
}
.book-chip button .material-symbols-outlined { font-size: 14px; }

/* ── BOOKSHELF ── */
.month-nav {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--cream); border: 1px solid var(--border);
  border-radius: 18px; padding: 12px 16px; margin-bottom: 14px;
}
.month-nav h2 {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 1.1rem; font-weight: 700; color: var(--brown-dark);
}
.month-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1.5px solid var(--border); background: var(--ivory);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--brown-dark); transition: background 0.15s;
}
.month-btn:hover { background: var(--ivory-dark); }
.month-btn .material-symbols-outlined { font-size: 20px; }

#bookshelf {
  background: linear-gradient(160deg, #7a5140 0%, #5c3d2e 100%);
  border-radius: 20px;
  padding: 12px;
  height: 480px;
  box-shadow: inset 0 4px 20px rgba(0,0,0,0.2), 0 4px 20px rgba(92,61,46,0.2);
  overflow-y: auto;
  cursor: grab;
  user-select: none;
}
#bookshelf.dragging { cursor: grabbing; }
#bookshelf::-webkit-scrollbar { width: 5px; }
#bookshelf::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

.shelf-row {
  display: flex;
  background: #fdf0e0;
  min-height: 130px;
  border-radius: 14px;
  border-bottom: 5px solid rgba(92,61,46,0.35);
  overflow: hidden;
  margin-bottom: 8px;
  animation: shelfRowIn 0.35s ease both;
}
@keyframes shelfRowIn { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:none; } }
.shelf-day-label {
  width: 44px; flex-shrink: 0;
  border-right: 1px solid rgba(210,195,180,0.5);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-size: 0.72rem; color: rgba(92,61,46,0.45);
  padding: 8px 0;
}
.shelf-day-label span { font-size: 1.2rem; font-weight: 700; color: rgba(92,61,46,0.5); }
.shelf-books {
  flex: 1; display: flex; align-items: flex-end;
  padding: 8px; gap: 4px; overflow-x: auto;
}
.book-spine {
  border-radius: 3px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  position: relative;
  transition: transform 0.2s, filter 0.2s;
  background: linear-gradient(90deg, rgba(255,255,255,0.18) 0%, rgba(0,0,0,0) 15%, rgba(0,0,0,0) 85%, rgba(0,0,0,0.12) 100%);
  box-shadow: 2px 0 6px rgba(0,0,0,0.12);
}
.book-spine:hover { transform: translateY(-6px); filter: brightness(1.05); }
.book-spine span {
  writing-mode: vertical-rl; transform: rotate(180deg);
  font-size: 9px; font-weight: 700;
  color: rgba(0,0,0,0.65); white-space: nowrap;
  overflow: hidden; max-height: 90px; padding: 2px 0;
}

/* subject colors */
.sc-사회문화 { background-color: #b7d9e8; }
.sc-생활과윤리 { background-color: #d4b8d8; }
.sc-수학 { background-color: #b8d8b8; }
.sc-영어 { background-color: #e8ddb0; }
.sc-국어 { background-color: #e8bfb8; }
.sc-기타 { background-color: #d8d0c8; }

/* ── ACTION CARDS ── */
.filter-row {
  display: flex; gap: 8px; margin-bottom: 14px;
}
.filter-row select {
  flex: 1; padding: 9px 12px; font-size: 0.82rem;
}
.action-card {
  background: var(--cream); border: 1px solid var(--border);
  border-radius: 18px; padding: 18px; margin-bottom: 10px;
  cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
}
.action-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(92,61,46,0.1); }
.action-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
.action-card-title { font-size: 1rem; font-weight: 700; color: var(--brown-dark); }
.action-stars { color: #c8960c; font-size: 0.85rem; }
.action-subject-tag {
  display: inline-block; padding: 3px 10px;
  background: var(--green-pale); color: var(--green);
  border-radius: 999px; font-size: 0.72rem; font-weight: 700;
  margin-bottom: 8px;
}
.action-desc { font-size: 0.83rem; color: var(--text-light); font-style: italic; }
.action-meta { display: flex; gap: 12px; margin-top: 10px; }
.action-meta span {
  font-size: 0.72rem; color: var(--text-light);
  display: flex; align-items: center; gap: 3px;
}
.action-meta .material-symbols-outlined { font-size: 13px; }
.action-empty { text-align: center; color: var(--text-light); padding: 40px 0; font-size: 0.9rem; }

/* ── MODAL ── */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.45); backdrop-filter: blur(4px);
  z-index: 200; align-items: center; justify-content: center; padding: 16px;
}
.modal-bg.open {
  display: flex;
  animation: modalBgIn 0.25s ease;
}
@keyframes modalBgIn { from { opacity:0; } to { opacity:1; } }
.modal {
  background: var(--cream); border: 1px solid var(--border);
  border-radius: 24px; padding: 28px;
  width: 100%; max-width: 440px;
  max-height: 88vh; overflow-y: auto;
  animation: modalIn 0.35s cubic-bezier(.34,1.4,.64,1) both;
  position: relative;
}
@keyframes modalIn { from { opacity:0; transform:scale(0.92) translateY(20px); } to { opacity:1; transform:none; } }
.modal-close {
  position: absolute; top: 16px; right: 16px;
  background: var(--ivory-dark); border: 1px solid var(--border);
  border-radius: 50%; width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-light);
  transition: background 0.15s;
}
.modal-close:hover { background: var(--border); }
.modal-close .material-symbols-outlined { font-size: 18px; }
.modal h2 {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 1.3rem; font-weight: 700;
  color: var(--brown-dark); padding-right: 36px;
  margin-bottom: 20px;
  padding-bottom: 14px; border-bottom: 1.5px solid var(--border);
}

.section-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.section-label {
  font-size: 0.85rem; font-weight: 700; color: var(--brown-mid);
  display: flex; align-items: center; gap: 6px;
}
.section-label .material-symbols-outlined { font-size: 16px; }
.modal-section { margin-bottom: 22px; }

.list-item {
  display: flex; align-items: flex-start; gap: 8px;
  background: var(--ivory-dark); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 12px;
  font-size: 0.85rem; margin-bottom: 6px;
  transition: background 0.15s;
}
.list-item-text { flex: 1; color: var(--text); }
.list-item-actions { display: flex; gap: 4px; flex-shrink: 0; }
.item-btn {
  background: none; border: none; cursor: pointer;
  padding: 2px; border-radius: 6px;
  color: var(--text-light); transition: background 0.15s;
  display: flex; align-items: center;
}
.item-btn:hover { background: var(--border); }
.item-btn .material-symbols-outlined { font-size: 15px; }

.add-box {
  display: none; margin-top: 6px;
  animation: fadeUp 0.25s ease;
}
.add-box.visible { display: flex; gap: 6px; }
.add-box input { flex: 1; padding: 9px 12px; }
.add-box button {
  padding: 9px 14px; border-radius: 12px;
  background: var(--green); color: #fff;
  border: none; cursor: pointer; font-size: 0.82rem;
  font-family: 'Gowun Dodum', sans-serif; font-weight: 700;
  white-space: nowrap;
}

.modal-footer {
  border-top: 1.5px solid var(--border);
  padding-top: 18px; margin-top: 20px;
  display: flex; flex-direction: column; gap: 8px;
}

/* small bunny decoration */
.bunny-deco {
  display: flex; justify-content: center; margin-bottom: 8px; opacity: 0.18;
}
</style>
</head>

<script>
// ── DATA ──
let studyData = JSON.parse(localStorage.getItem('studyData')) || [];
let bookList  = JSON.parse(localStorage.getItem('bookList'))  || { "사회문화": ["기출문제집","개념완성"], "영어": ["수능특강","Word Master"] };
let actions   = JSON.parse(localStorage.getItem('actions'))   || [
  { title:"발문 다시보기", desc:"옳은 것 vs 옳지 않은 것 구분", subject:"사회문화", star:3,
    act:["문두에 크게 표시하기"], warn:["흥분해서 반대로 읽지 말 것"], prob:["기출 22학년도 10번"] }
];
let currentViewDate = new Date();
let currActIdx = -1, currentEditIdx = -1;
let editItemType = '', editItemIdx = -1;

const subjectColorMap = {
  "사회문화":"sc-사회문화","생활과윤리":"sc-생활과윤리",
  "수학":"sc-수학","영어":"sc-영어","국어":"sc-국어","기타":"sc-기타"
};

// ── TODAY DATE ──
(function() {
  const d = new Date();
  const wd = ['일','월','화','수','목','금','토'][d.getDay()];
  document.getElementById('today-date').textContent =
    `${d.getMonth()+1}월 ${d.getDate()}일 (${wd})`;
})();

// ── TOAST ──
function showToast(msg, type='default') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast' + (type !== 'default' ? ' '+type : '');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => {
    t.classList.add('out');
    setTimeout(() => t.remove(), 350);
  }, 2200);
}

// ── TABS ──
function showTab(t) {
  document.querySelectorAll('.tab-view').forEach(d => d.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(t+'-view').classList.add('active');
  document.getElementById('btn-'+t).classList.add('active');
  if(t === 'tab2') renderBookshelf();
  if(t === 'tab3') renderActions();
}

// ── CATEGORY ──
function updateCategoryUI() {
  localStorage.setItem('bookList', JSON.stringify(bookList));
  const subSel = document.getElementById('sel-subject');
  subSel.innerHTML = '<option>과목 선택</option>';
  Object.keys(bookList).forEach(sub =>
    subSel.innerHTML += `<option value="${sub}">${sub}</option>`
  );
  const listContainer = document.getElementById('category-list');
  listContainer.innerHTML = Object.keys(bookList).map(sub => `
    <div class="cat-item">
      <div class="cat-item-header">
        <span class="cat-name">📚 ${sub}</span>
        <button class="btn-del-cat" onclick="delCategory('${sub}')">과목 삭제</button>
      </div>
      <div>
        ${bookList[sub].map(book => `
          <span class="book-chip">
            ${book}
            <button onclick="delBook('${sub}','${book}')">
              <span class="material-symbols-outlined">close</span>
            </button>
          </span>`).join('')}
      </div>
    </div>`).join('');
}

function updateBookSelect() {
  const subject = document.getElementById('sel-subject').value;
  const bs = document.getElementById('sel-book');
  bs.innerHTML = '<option>책 선택</option>';
  (bookList[subject] || []).forEach(b => bs.innerHTML += `<option value="${b}">${b}</option>`);
}

function addCategory() {
  const sub  = document.getElementById('new-sub').value.trim();
  const book = document.getElementById('new-book').value.trim();
  if(!sub || !book) return showToast('과목과 책 이름을 모두 입력하세요.','error');
  if(!bookList[sub]) bookList[sub] = [];
  if(!bookList[sub].includes(book)) bookList[sub].push(book);
  document.getElementById('new-sub').value = '';
  document.getElementById('new-book').value = '';
  updateCategoryUI();
  showToast(`'${book}' 교재가 추가됐어요! 📖`,'success');
}

function delCategory(sub) {
  if(!confirm(`'${sub}' 과목과 등록된 책을 모두 삭제할까요?`)) return;
  delete bookList[sub];
  updateCategoryUI();
  showToast(`'${sub}' 과목이 삭제됐어요.`);
}
function delBook(sub, book) {
  bookList[sub] = bookList[sub].filter(b => b !== book);
  if(bookList[sub].length === 0) delete bookList[sub];
  updateCategoryUI();
  showToast(`'${book}' 교재가 삭제됐어요.`);
}

// ── STUDY RECORD ──
function saveStudy() {
  const s     = document.getElementById('sel-subject').value;
  const b     = document.getElementById('sel-book').value;
  const start = parseInt(document.getElementById('in-start').value);
  const end   = parseInt(document.getElementById('in-end').value);
  const memo  = document.getElementById('in-memo').value;
  if(s==='과목 선택'||b==='책 선택'||isNaN(start)||isNaN(end))
    return showToast('과목, 책, 페이지를 정확히 입력해 주세요.','error');
  studyData.push({
    date: (new Date().getMonth()+1)+'/'+new Date().getDate(),
    timestamp: Date.now(),
    subject:s, book:b, start, end, memo,
    width: Math.max(25,(end-start+1)*3)
  });
  localStorage.setItem('studyData', JSON.stringify(studyData));
  document.getElementById('in-start').value = '';
  document.getElementById('in-end').value = '';
  document.getElementById('in-memo').value = '';
  showToast('기록이 책장에 보관됐어요! 🐾','success');
}

// ── BOOKSHELF ──
function renderBookshelf() {
  document.getElementById('current-month').innerText =
    `${currentViewDate.getFullYear()}년 ${currentViewDate.getMonth()+1}월`;
  const shelf = document.getElementById('bookshelf');
  shelf.innerHTML = '';
  const lastDay = new Date(currentViewDate.getFullYear(), currentViewDate.getMonth()+1, 0).getDate();
  for(let day=1; day<=lastDay; day++) {
    const dateStr = `${currentViewDate.getMonth()+1}/${day}`;
    const row = document.createElement('div');
    row.className = 'shelf-row';
    row.style.animationDelay = (day*0.02)+'s';
    row.innerHTML = `
      <div class="shelf-day-label"><span>${day}</span>일</div>
      <div class="shelf-books" id="day-slot-${day}"></div>`;
    const slot = row.querySelector(`#day-slot-${day}`);
    studyData.forEach((data,index) => {
      if(data.date===dateStr) {
        const colorClass = subjectColorMap[data.subject] || 'sc-기타';
        const w = Math.min(60, Math.max(24, data.width));
        const book = document.createElement('div');
        book.className = `book-spine ${colorClass}`;
        book.style.width = w+'px'; book.style.height = '96px';
        book.innerHTML = `<span>${data.book}</span>`;
        book.onclick = () => openDetailModal(index);
        slot.appendChild(book);
      }
    });
    shelf.appendChild(row);
  }
}
function changeMonth(o) {
  currentViewDate.setMonth(currentViewDate.getMonth()+o);
  renderBookshelf();
}

// ── BOOKSHELF DRAG SCROLL ──
(function() {
  let isDown = false, startY, scrollTop;
  function initDrag() {
    const el = document.getElementById('bookshelf');
    if(!el) return;
    el.addEventListener('mousedown', e => {
      isDown = true; el.classList.add('dragging');
      startY = e.pageY - el.offsetTop; scrollTop = el.scrollTop;
    });
    el.addEventListener('mouseleave', () => { isDown = false; el.classList.remove('dragging'); });
    el.addEventListener('mouseup',    () => { isDown = false; el.classList.remove('dragging'); });
    el.addEventListener('mousemove',  e => {
      if(!isDown) return; e.preventDefault();
      const y = e.pageY - el.offsetTop;
      el.scrollTop = scrollTop - (y - startY);
    });
    // touch
    el.addEventListener('touchstart', e => {
      startY = e.touches[0].pageY; scrollTop = el.scrollTop;
    }, {passive:true});
    el.addEventListener('touchmove', e => {
      const dy = startY - e.touches[0].pageY;
      el.scrollTop = scrollTop + dy;
    }, {passive:true});
  }
  document.addEventListener('DOMContentLoaded', initDrag);
})();
function openDetailModal(idx) {
  currentEditIdx = idx;
  const d = studyData[idx];
  document.getElementById('edit-memo').value  = d.memo  || '';
  document.getElementById('edit-start').value = d.start || '';
  document.getElementById('edit-end').value   = d.end   || '';
  document.getElementById('study-detail-modal').classList.add('open');
}
function closeDetailModal() {
  document.getElementById('study-detail-modal').classList.remove('open');
}
function confirmEditStudy() {
  const memo  = document.getElementById('edit-memo').value;
  const start = parseInt(document.getElementById('edit-start').value);
  const end   = parseInt(document.getElementById('edit-end').value);
  studyData[currentEditIdx].memo = memo;
  if(!isNaN(start)&&!isNaN(end)) {
    studyData[currentEditIdx].start = start;
    studyData[currentEditIdx].end   = end;
    studyData[currentEditIdx].width = Math.max(25,(end-start+1)*3);
  }
  localStorage.setItem('studyData', JSON.stringify(studyData));
  closeDetailModal(); renderBookshelf();
  showToast('기록이 수정됐어요! ✏️','success');
}
function deleteStudy() {
  if(!confirm('이 학습 기록을 책장에서 영구히 제거할까요?')) return;
  studyData.splice(currentEditIdx,1);
  localStorage.setItem('studyData', JSON.stringify(studyData));
  closeDetailModal(); renderBookshelf();
  showToast('기록이 삭제됐어요.','default');
}

// ── ACTION CARDS ──
function renderActions() {
  const filterSub = document.getElementById('filter-subject')?.value || 'all';
  const sortOrder = document.getElementById('sort-order')?.value || 'default';
  let indexed = actions.map((a,i) => ({...a, _origIdx:i}));
  if(filterSub!=='all') indexed = indexed.filter(a=>a.subject===filterSub);
  if(sortOrder==='star-desc') indexed.sort((a,b)=>b.star-a.star);
  else if(sortOrder==='star-asc') indexed.sort((a,b)=>a.star-b.star);
  else if(sortOrder==='date-desc') indexed.sort((a,b)=>b._origIdx-a._origIdx);
  else if(sortOrder==='date-asc') indexed.sort((a,b)=>a._origIdx-b._origIdx);

  const container = document.getElementById('action-list');
  container.innerHTML = indexed.length===0
    ? `<div class="action-empty">🐰 해당하는 강령 카드가 없어요.</div>`
    : indexed.map((a,ni) => `
      <div class="action-card" style="animation:cardPop 0.35s ease ${ni*0.05}s both" onclick="openActionModal(${a._origIdx})">
        <div class="action-card-top">
          <div class="action-card-title">${a.title}</div>
          <div class="action-stars">${'★'.repeat(a.star)}</div>
        </div>
        <div class="action-subject-tag">${a.subject}</div>
        <div class="action-desc">"${a.desc||''}"</div>
        <div class="action-meta">
          <span><span class="material-symbols-outlined">playlist_add_check</span>${a.act?.length||0}</span>
          <span><span class="material-symbols-outlined">warning</span>${a.warn?.length||0}</span>
          <span><span class="material-symbols-outlined">error</span>${a.prob?.length||0}</span>
        </div>
      </div>`).join('');
}

function saveAction() {
  const title = document.getElementById('a-title').value.trim();
  if(!title) return showToast('강령 제목을 입력해 주세요.','error');
  actions.push({
    title, desc: document.getElementById('a-desc').value.trim(),
    subject: document.getElementById('a-subject').value,
    star: parseInt(document.getElementById('a-star').value),
    act:[], warn:[], prob:[]
  });
  localStorage.setItem('actions', JSON.stringify(actions));
  document.getElementById('a-title').value = '';
  document.getElementById('a-desc').value  = '';
  renderActions();
  showToast('강령 카드가 추가됐어요! 🌿','success');
}

function openActionModal(i) {
  currActIdx = i;
  const a = actions[i];
  document.getElementById('modal-title').innerText = a.title;
  ['act','warn','prob'].forEach(type => {
    document.getElementById('add-box-'+type).classList.remove('visible');
    document.getElementById('input-'+type).value = '';
    renderList(type);
  });
  document.getElementById('action-modal').classList.add('open');
}
function deleteActionCard() {
  if(!confirm('이 강령 카드를 삭제할까요? 되돌릴 수 없습니다.')) return;
  actions.splice(currActIdx,1);
  localStorage.setItem('actions', JSON.stringify(actions));
  document.getElementById('action-modal').classList.remove('open');
  renderActions();
  showToast('강령 카드가 삭제됐어요.','default');
}
function closeModal() {
  document.getElementById('action-modal').classList.remove('open');
  renderActions();
}

function renderList(type) {
  const a = actions[currActIdx];
  document.getElementById('list-'+type).innerHTML =
    (a[type]||[]).map((item,i) => `
      <div class="list-item">
        <span style="color:var(--text-light);margin-top:1px">•</span>
        <span class="list-item-text">${item}</span>
        <div class="list-item-actions">
          <button class="item-btn" onclick="openEditItemModal('${type}',${i})">
            <span class="material-symbols-outlined">edit</span>
          </button>
          <button class="item-btn" onclick="deleteItem('${type}',${i})" style="color:#c07070">
            <span class="material-symbols-outlined">delete</span>
          </button>
        </div>
      </div>`).join('');
}

function openAddBox(type) {
  ['act','warn','prob'].forEach(t =>
    document.getElementById('add-box-'+t).classList.remove('visible'));
  document.getElementById('add-box-'+type).classList.add('visible');
  document.getElementById('input-'+type).focus();
}
function confirmAdd(type) {
  const input = document.getElementById('input-'+type);
  const val = input.value.trim();
  if(!val) return;
  if(!actions[currActIdx][type]) actions[currActIdx][type] = [];
  actions[currActIdx][type].push(val);
  localStorage.setItem('actions', JSON.stringify(actions));
  input.value = '';
  document.getElementById('add-box-'+type).classList.remove('visible');
  renderList(type);
  showToast('항목이 추가됐어요.','success');
}

function openEditItemModal(type,i) {
  editItemType = type; editItemIdx = i;
  document.getElementById('edit-item-input').value = actions[currActIdx][type][i];
  document.getElementById('edit-item-modal').classList.add('open');
}
function closeEditItemModal() {
  document.getElementById('edit-item-modal').classList.remove('open');
}
function confirmEditItem() {
  const val = document.getElementById('edit-item-input').value.trim();
  if(!val) return;
  actions[currActIdx][editItemType][editItemIdx] = val;
  localStorage.setItem('actions', JSON.stringify(actions));
  closeEditItemModal();
  renderList(editItemType);
  showToast('수정됐어요! ✏️','success');
}
function deleteItem(type,i) {
  if(!confirm('이 항목을 삭제할까요?')) return;
  actions[currActIdx][type].splice(i,1);
  localStorage.setItem('actions', JSON.stringify(actions));
  renderList(type);
  showToast('항목이 삭제됐어요.','default');
}

// ── INIT ──
updateCategoryUI();
renderActions();
</script>
